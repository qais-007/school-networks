name: Keep Supabase active

on:
  schedule:
    - cron: "17 3 */2 * *"   # every 2 days at 03:17 UTC
  workflow_dispatch: {}       # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the schools table
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://uwhqpjgobfrbvckafiaw.supabase.co/rest/v1/schools?select=code&limit=1" \
            -H "apikey: sb_publishable_Oev9ecoF3VknaTa_hjfgvA_rVp4ckXN")
          echo "HTTP status: $code"
          test "$code" = "200"
